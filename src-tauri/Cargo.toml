[package]
name = "horse2pdf"
# The app version shown to users comes from package.json (see tauri.conf.json).
version = "0.1.0"
description = "Viewer for e-invoices (XRechnung, ZUGFeRD, Factur-X, Peppol BIS)"
authors = ["horse2pdf contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "horse2pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2.1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
